<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador | ToolBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 750px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .herramienta {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .contador {
            font-size: 72px;
            font-weight: bold;
            color: #1e3a8a;
            margin: 15px 0 30px;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 14px 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .boton-restar {
            background: #dc2626;
        }

        .boton-restar:hover {
            background: #b91c1c;
        }

        .boton-secundario {
            background: #e5e7eb;
            color: #374151;
        }

        .boton-secundario:hover {
            background: #d1d5db;
        }

        .ajuste {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .ajuste label {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        .ajuste input {
            width: 100px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            outline: none;
        }

        .ajuste input:focus {
            border-color: #2563eb;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .herramienta {
                padding: 25px 20px;
            }

            .contador {
                font-size: 58px;
            }

            .botones {
                grid-template-columns: 1fr;
            }

            .ajuste {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolBox</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>🔢 Contador</h1>
        <p>Cuenta hacia arriba o hacia abajo con un contador sencillo.</p>
    </div>

    <section class="herramienta">

        <div
            id="contador"
            class="contador"
        >
            0
        </div>

        <div class="botones">

            <button
                id="restar"
                class="boton-restar"
                type="button"
            >
                − Restar
            </button>

            <button
                id="sumar"
                type="button"
            >
                + Sumar
            </button>

            <button
                id="reiniciar"
                class="boton-secundario"
                type="button"
            >
                Reiniciar
            </button>

        </div>

        <div class="ajuste">

            <label for="paso">
                Paso:
            </label>

            <input
                type="number"
                id="paso"
                value="1"
                min="1"
            >

        </div>

    </section>

    <a href="herramientas.html" class="volver">
        ← Volver a Herramientas
    </a>

</main>

<script>

    const contadorElemento =
        document.getElementById("contador");

    const sumar =
        document.getElementById("sumar");

    const restar =
        document.getElementById("restar");

    const reiniciar =
        document.getElementById("reiniciar");

    const paso =
        document.getElementById("paso");


    let contador = 0;


    function obtenerPaso() {

        let valor =
            parseInt(paso.value);

        if (
            isNaN(valor) ||
            valor < 1
        ) {

            valor = 1;
            paso.value = 1;

        }

        return valor;
    }


    function actualizar() {

        contadorElemento.textContent =
            contador;

    }


    sumar.addEventListener("click", () => {

        contador += obtenerPaso();

        actualizar();

    });


    restar.addEventListener("click", () => {

        contador -= obtenerPaso();

        actualizar();

    });


    reiniciar.addEventListener("click", () => {

        contador = 0;

        actualizar();

    });


    paso.addEventListener("change", () => {

        obtenerPaso();

    });


    actualizar();

</script>

</body>
</html>
