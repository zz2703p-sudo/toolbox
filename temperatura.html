<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura | ToolBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .conversor {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: end;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #2563eb;
        }

        .intercambiar {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #eef2ff;
            color: #2563eb;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .intercambiar:hover {
            background: #dbeafe;
        }

        .resultado {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
            min-height: 65px;
        }

        .resultado-titulo {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .resultado-valor {
            font-size: 26px;
            font-weight: bold;
            color: #1e3a8a;
            word-break: break-word;
        }

        .boton-convertir {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-convertir:hover {
            background: #1d4ed8;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .conversor {
                padding: 20px;
            }

            .fila {
                grid-template-columns: 1fr;
            }

            .intercambiar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolBox</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>🌡️ Conversor de temperatura</h1>
        <p>Convierte fácilmente entre Celsius, Fahrenheit y Kelvin.</p>
    </div>

    <section class="conversor">

        <div class="fila">

            <div class="campo">
                <label for="valor">Valor</label>
                <input
                    type="number"
                    id="valor"
                    step="any"
                    placeholder="Introduce un valor"
                >
            </div>

            <button
                class="intercambiar"
                id="intercambiar"
                type="button"
                title="Intercambiar unidades"
            >
                ⇄
            </button>

            <div class="campo">
                <label for="unidadOrigen">De</label>
                <select id="unidadOrigen">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>

                <label for="unidadDestino" style="margin-top: 15px;">
                    A
                </label>

                <select id="unidadDestino">
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="celsius">Celsius (°C)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

        </div>

        <button class="boton-convertir" id="convertir" type="button">
            Convertir
        </button>

        <div class="resultado">
            <div class="resultado-titulo">Resultado</div>
            <div class="resultado-valor" id="resultado">
                —
            </div>
        </div>

    </section>

    <a href="conversores.html" class="volver">
        ← Volver a Conversores
    </a>

</main>

<script>
    const valor = document.getElementById("valor");
    const unidadOrigen = document.getElementById("unidadOrigen");
    const unidadDestino = document.getElementById("unidadDestino");
    const resultado = document.getElementById("resultado");
    const convertir = document.getElementById("convertir");
    const intercambiar = document.getElementById("intercambiar");

    function limpiarResultado() {
        resultado.textContent = "—";
    }

    function redondear(numero) {
        return Math.round(numero * 100000000) / 100000000;
    }

    function convertirTemperatura(numero, origen, destino) {

        let celsius;

        // Primero convertimos a Celsius
        if (origen === "celsius") {
            celsius = numero;
        } else if (origen === "fahrenheit") {
            celsius = (numero - 32) * 5 / 9;
        } else if (origen === "kelvin") {
            celsius = numero - 273.15;
        }

        // Después convertimos desde Celsius
        if (destino === "celsius") {
            return celsius;
        }

        if (destino === "fahrenheit") {
            return celsius * 9 / 5 + 32;
        }

        if (destino === "kelvin") {
            return celsius + 273.15;
        }
    }

    function nombreUnidad(unidad) {
        if (unidad === "celsius") return "°C";
        if (unidad === "fahrenheit") return "°F";
        return "K";
    }

    convertir.addEventListener("click", () => {

        if (valor.value.trim() === "") {
            resultado.textContent = "Introduce un valor.";
            return;
        }

        const numero = Number(valor.value);

        if (Number.isNaN(numero)) {
            resultado.textContent = "Introduce un número válido.";
            return;
        }

        // Kelvin no puede ser inferior a 0
        if (unidadOrigen.value === "kelvin" && numero < 0) {
            resultado.textContent = "Kelvin no puede ser inferior a 0 K.";
            return;
        }

        const resultadoConversion = convertirTemperatura(
            numero,
            unidadOrigen.value,
            unidadDestino.value
        );

        // Comprobamos que el resultado tampoco sea una temperatura Kelvin inválida
        if (
            unidadDestino.value === "kelvin" &&
            resultadoConversion < 0
        ) {
            resultado.textContent = "El resultado sería inferior a 0 K.";
            return;
        }

        const resultadoFinal = redondear(resultadoConversion);

        resultado.textContent =
            `${resultadoFinal} ${nombreUnidad(unidadDestino.value)}`;
    });

    intercambiar.addEventListener("click", () => {

        const origenAnterior = unidadOrigen.value;
        unidadOrigen.value = unidadDestino.value;
        unidadDestino.value = origenAnterior;

        limpiarResultado();
    });

    valor.addEventListener("input", limpiarResultado);
    unidadOrigen.addEventListener("change", limpiarResultado);
    unidadDestino.addEventListener("change", limpiarResultado);
</script>

</body>
</html>
