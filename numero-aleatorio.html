<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número aleatorio | ToolBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .generador {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .campos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        .campo input:focus {
            border-color: #2563eb;
        }

        .boton-generar {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-generar:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 25px;
            padding: 25px 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .resultado-titulo {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .resultado-valor {
            font-size: 42px;
            font-weight: bold;
            color: #1e3a8a;
            word-break: break-word;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .generador {
                padding: 20px;
            }

            .campos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolBox</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>🎲 Número aleatorio</h1>
        <p>Genera un número aleatorio dentro del intervalo que quieras.</p>
    </div>

    <section class="generador">

        <div class="campos">

            <div class="campo">
                <label for="minimo">Número mínimo</label>

                <input
                    type="number"
                    id="minimo"
                    value="1"
                    placeholder="Mínimo"
                >
            </div>

            <div class="campo">
                <label for="maximo">Número máximo</label>

                <input
                    type="number"
                    id="maximo"
                    value="100"
                    placeholder="Máximo"
                >
            </div>

        </div>

        <button class="boton-generar" id="generar" type="button">
            Generar número
        </button>

        <div class="resultado">

            <div class="resultado-titulo">
                Número generado
            </div>

            <div class="resultado-valor" id="resultado">
                —
            </div>

        </div>

    </section>

    <a href="generadores.html" class="volver">
        ← Volver a Generadores
    </a>

</main>

<script>

    const minimo = document.getElementById("minimo");
    const maximo = document.getElementById("maximo");
    const generar = document.getElementById("generar");
    const resultado = document.getElementById("resultado");

    generar.addEventListener("click", () => {

        const min = Number(minimo.value);
        const max = Number(maximo.value);

        if (!Number.isInteger(min) || !Number.isInteger(max)) {
            resultado.textContent = "Introduce números enteros.";
            return;
        }

        if (min > max) {
            resultado.textContent = "El mínimo no puede ser mayor que el máximo.";
            return;
        }

        const numero = Math.floor(
            Math.random() * (max - min + 1)
        ) + min;

        resultado.textContent = numero;
    });

</script>

</body>
</html>
