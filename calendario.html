<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario | ToolBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .herramienta {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .controles {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .boton {
            border: none;
            border-radius: 9px;
            padding: 11px 17px;
            background: #e5e7eb;
            color: #374151;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton:hover {
            background: #d1d5db;
        }

        .mes-año {
            font-size: 22px;
            font-weight: bold;
            color: #1e3a8a;
            text-align: center;
        }

        .dias-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }

        .dia-semana {
            text-align: center;
            padding: 10px 5px;
            font-size: 13px;
            font-weight: bold;
            color: #6b7280;
        }

        .calendario {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .dia {
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: #f1f5f9;
            font-size: 15px;
            cursor: default;
        }

        .dia.hoy {
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .dia.vacio {
            background: transparent;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .herramienta {
                padding: 20px;
            }

            .controles {
                gap: 8px;
            }

            .mes-año {
                font-size: 18px;
            }

            .boton {
                padding: 9px 12px;
            }

            .dia {
                min-height: 45px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolBox</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>📆 Calendario</h1>
        <p>Consulta cualquier mes y año fácilmente.</p>
    </div>

    <section class="herramienta">

        <div class="controles">

            <button
                class="boton"
                id="anterior"
                type="button"
            >
                ← Anterior
            </button>

            <div
                class="mes-año"
                id="mesAño"
            ></div>

            <button
                class="boton"
                id="siguiente"
                type="button"
            >
                Siguiente →
            </button>

        </div>

        <div class="dias-semana">

            <div class="dia-semana">Lun</div>
            <div class="dia-semana">Mar</div>
            <div class="dia-semana">Mié</div>
            <div class="dia-semana">Jue</div>
            <div class="dia-semana">Vie</div>
            <div class="dia-semana">Sáb</div>
            <div class="dia-semana">Dom</div>

        </div>

        <div
            class="calendario"
            id="calendario"
        ></div>

    </section>

    <a href="herramientas.html" class="volver">
        ← Volver a Herramientas
    </a>

</main>

<script>

    const mesAño = document.getElementById("mesAño");
    const calendario = document.getElementById("calendario");
    const anterior = document.getElementById("anterior");
    const siguiente = document.getElementById("siguiente");

    const nombresMeses = [
        "Enero",
        "Febrero",
        "Marzo",
        "Abril",
        "Mayo",
        "Junio",
        "Julio",
        "Agosto",
        "Septiembre",
        "Octubre",
        "Noviembre",
        "Diciembre"
    ];

    const hoy = new Date();

    let mesActual = hoy.getMonth();
    let añoActual = hoy.getFullYear();

    function mostrarCalendario() {

        calendario.innerHTML = "";

        mesAño.textContent =
            `${nombresMeses[mesActual]} ${añoActual}`;

        const primerDia =
            new Date(
                añoActual,
                mesActual,
                1
            );

        const ultimoDia =
            new Date(
                añoActual,
                mesActual + 1,
                0
            );

        /*
         * JavaScript usa:
         * 0 = domingo
         * 1 = lunes
         * ...
         * 6 = sábado
         *
         * Lo convertimos para que
         * la semana empiece en lunes.
         */

        let diaInicio =
            primerDia.getDay();

        diaInicio =
            diaInicio === 0 ? 6 : diaInicio - 1;

        for (let i = 0; i < diaInicio; i++) {

            const vacio =
                document.createElement("div");

            vacio.className = "dia vacio";

            calendario.appendChild(vacio);
        }

        for (
            let dia = 1;
            dia <= ultimoDia.getDate();
            dia++
        ) {

            const elemento =
                document.createElement("div");

            elemento.className = "dia";

            elemento.textContent = dia;

            if (
                dia === hoy.getDate() &&
                mesActual === hoy.getMonth() &&
                añoActual === hoy.getFullYear()
            ) {
                elemento.classList.add("hoy");
            }

            calendario.appendChild(elemento);
        }
    }

    anterior.addEventListener("click", () => {

        mesActual--;

        if (mesActual < 0) {
            mesActual = 11;
            añoActual--;
        }

        mostrarCalendario();
    });

    siguiente.addEventListener("click", () => {

        mesActual++;

        if (mesActual > 11) {
            mesActual = 0;
            añoActual++;
        }

        mostrarCalendario();
    });

    mostrarCalendario();

</script>

</body>
</html>
