<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotería | ToolBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .generador {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .sorteos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .sorteo {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .sorteo:hover {
            border-color: #2563eb;
        }

        .sorteo.activo {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .sorteo h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .sorteo p {
            font-size: 13px;
            color: #6b7280;
        }

        .boton-generar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-generar:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 25px;
            padding: 25px 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
        }

        .resultado-titulo {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        .numero-loteria {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            height: 75px;
            padding: 0 20px;
            background: white;
            border: 2px solid #dbe3ef;
            border-radius: 12px;
            color: #1e3a8a;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .complementario {
            margin-top: 15px;
            font-size: 15px;
            color: #4b5563;
        }

        .complementario strong {
            color: #1e3a8a;
        }

        .mensaje {
            margin-top: 12px;
            font-size: 14px;
            color: #dc2626;
            min-height: 18px;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .generador {
                padding: 20px;
            }

            .sorteos {
                grid-template-columns: 1fr;
            }

            .numero-loteria {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolBox</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>🎟️ Lotería</h1>
        <p>Genera números aleatorios para diferentes sorteos.</p>
    </div>

    <section class="generador">

        <div class="sorteos">

            <div class="sorteo activo" data-sorteo="primitiva">
                <h3>La Primitiva</h3>
                <p>6 números + complementario</p>
            </div>

            <div class="sorteo" data-sorteo="bonoloto">
                <h3>Bonoloto</h3>
                <p>6 números + complementario</p>
            </div>

            <div class="sorteo" data-sorteo="euromillones">
                <h3>Euromillones</h3>
                <p>5 números + 2 estrellas</p>
            </div>

        </div>

        <button
            class="boton-generar"
            id="generar"
            type="button"
        >
            Generar combinación
        </button>

        <div class="resultado">

            <div class="resultado-titulo" id="tituloResultado">
                La Primitiva
            </div>

            <div class="numero-loteria" id="numeros">
                —
            </div>

            <div class="complementario" id="extra"></div>

            <div class="mensaje" id="mensaje"></div>

        </div>

    </section>

    <a href="generadores.html" class="volver">
        ← Volver a Generadores
    </a>

</main>

<script>

    const sorteos = document.querySelectorAll(".sorteo");
    const generar = document.getElementById("generar");
    const tituloResultado = document.getElementById("tituloResultado");
    const numeros = document.getElementById("numeros");
    const extra = document.getElementById("extra");
    const mensaje = document.getElementById("mensaje");

    let sorteoActual = "primitiva";

    sorteos.forEach(sorteo => {

        sorteo.addEventListener("click", () => {

            sorteos.forEach(item => {
                item.classList.remove("activo");
            });

            sorteo.classList.add("activo");

            sorteoActual = sorteo.dataset.sorteo;

            actualizarTitulo();

            numeros.textContent = "—";
            extra.textContent = "";
            mensaje.textContent = "";
        });
    });

    function actualizarTitulo() {

        if (sorteoActual === "primitiva") {
            tituloResultado.textContent = "La Primitiva";
        }

        if (sorteoActual === "bonoloto") {
            tituloResultado.textContent = "Bonoloto";
        }

        if (sorteoActual === "euromillones") {
            tituloResultado.textContent = "Euromillones";
        }
    }

    function numerosUnicos(cantidad, minimo, maximo) {

        const resultado = [];

        while (resultado.length < cantidad) {

            const numero =
                Math.floor(
                    Math.random() * (maximo - minimo + 1)
                ) + minimo;

            if (!resultado.includes(numero)) {
                resultado.push(numero);
            }
        }

        return resultado.sort((a, b) => a - b);
    }

    function formatoNumero(numero) {

        return String(numero).padStart(2, "0");
    }

    generar.addEventListener("click", () => {

        mensaje.textContent = "";

        if (
            sorteoActual === "primitiva" ||
            sorteoActual === "bonoloto"
        ) {

            const combinacion =
                numerosUnicos(6, 1, 49);

            const complementario =
                numerosUnicos(1, 1, 49)[0];

            numeros.textContent =
                combinacion
                    .map(formatoNumero)
                    .join(" · ");

            extra.innerHTML =
                `Complementario: <strong>${formatoNumero(complementario)}</strong>`;

            return;
        }

        if (sorteoActual === "euromillones") {

            const combinacion =
                numerosUnicos(5, 1, 50);

            const estrellas =
                numerosUnicos(2, 1, 12);

            numeros.textContent =
                combinacion
                    .map(formatoNumero)
                    .join(" · ");

            extra.innerHTML =
                `Estrellas: <strong>${estrellas
                    .map(formatoNumero)
                    .join(" · ")}</strong>`;
        }

    });

</script>

</body>
</html>
