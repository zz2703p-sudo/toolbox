<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regla online | ToolBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 950px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .herramienta {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .regla-contenedor {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .regla {
            position: relative;
            min-width: 800px;
            height: 150px;
            background: #f8fafc;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            overflow: hidden;
        }

        .escala {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 35px;
            height: 80px;
            border-bottom: 3px solid #374151;
        }

        .marca {
            position: absolute;
            bottom: 0;
            width: 1px;
            height: 18px;
            background: #374151;
        }

        .marca.mayor {
            height: 32px;
            width: 2px;
        }

        .marca-media {
            height: 25px;
        }

        .numero {
            position: absolute;
            bottom: 38px;
            transform: translateX(-50%);
            font-size: 13px;
            color: #374151;
        }

        .unidad {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }

        .informacion {
            margin-top: 25px;
            padding: 18px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
            color: #4b5563;
            font-size: 14px;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .herramienta {
                padding: 20px;
            }

            .regla {
                min-width: 700px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolBox</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>📏 Regla online</h1>
        <p>Utiliza una regla virtual para medir longitudes en centímetros.</p>
    </div>

    <section class="herramienta">

        <div class="regla-contenedor">

            <div class="regla">

                <div class="escala" id="escala"></div>

            </div>

        </div>

        <div class="unidad">
            Medida en centímetros
        </div>

        <div class="informacion">
            La regla muestra una escala de 0 a 30 cm.
            Puedes desplazarte horizontalmente para verla completa.
        </div>

    </section>

    <a href="herramientas.html" class="volver">
        ← Volver a Herramientas
    </a>

</main>

<script>

    const escala = document.getElementById("escala");

    const centimetros = 30;

    for (let i = 0; i <= centimetros * 10; i++) {

        const marca = document.createElement("div");

        marca.classList.add("marca");

        const posicion =
            (i / (centimetros * 10)) * 100;

        marca.style.left = posicion + "%";

        if (i % 10 === 0) {

            marca.classList.add("mayor");

            const numero = document.createElement("span");

            numero.classList.add("numero");

            numero.textContent = i / 10;

            numero.style.left = posicion + "%";

            escala.appendChild(numero);

        } else if (i % 5 === 0) {

            marca.classList.add("marca-media");
        }

        escala.appendChild(marca);
    }

</script>

</body>
</html>
