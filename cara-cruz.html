<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cara o cruz | Herramio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .generador {
            background: white;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .moneda {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 5px solid #dbe3ef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .boton-lanzar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-lanzar:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 25px;
            padding: 22px;
            background: #f1f5f9;
            border-radius: 10px;
        }

        .resultado-titulo {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .resultado-valor {
            font-size: 32px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .generador {
                padding: 25px 20px;
            }

            .moneda {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Herramio</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>🪙 Cara o cruz</h1>
        <p>Lanza una moneda virtual y deja que el azar decida.</p>
    </div>

    <section class="generador">

        <div class="moneda" id="moneda">
            🪙
        </div>

        <button class="boton-lanzar" id="lanzar" type="button">
            Lanzar moneda
        </button>

        <div class="resultado">

            <div class="resultado-titulo">
                Resultado
            </div>

            <div class="resultado-valor" id="resultado">
                —
            </div>

        </div>

    </section>

    <a href="generadores.html" class="volver">
        ← Volver a Generadores
    </a>

</main>

<script>

    const lanzar = document.getElementById("lanzar");
    const moneda = document.getElementById("moneda");
    const resultado = document.getElementById("resultado");

    lanzar.addEventListener("click", () => {

        const cara = Math.random() < 0.5;

        if (cara) {
            moneda.textContent = "C";
            resultado.textContent = "Cara";
        } else {
            moneda.textContent = "X";
            resultado.textContent = "Cruz";
        }
    });

</script>

</body>
</html>
