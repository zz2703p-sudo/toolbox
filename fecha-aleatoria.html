<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fecha aleatoria | ToolBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .generador {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo label {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .campo input:focus {
            border-color: #2563eb;
        }

        .boton-generar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-generar:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 25px;
            padding: 30px 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
        }

        .resultado-titulo {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .fecha {
            font-size: 36px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        .mensaje {
            margin-top: 12px;
            min-height: 18px;
            font-size: 14px;
            color: #dc2626;
        }

        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .generador {
                padding: 20px;
            }

            .opciones {
                grid-template-columns: 1fr;
            }

            .fecha {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ToolBox</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>📅 Fecha aleatoria</h1>
        <p>Genera una fecha aleatoria entre dos fechas.</p>
    </div>

    <section class="generador">

        <div class="opciones">

            <div class="campo">
                <label for="fechaInicio">Fecha inicial</label>
                <input
                    type="date"
                    id="fechaInicio"
                >
            </div>

            <div class="campo">
                <label for="fechaFin">Fecha final</label>
                <input
                    type="date"
                    id="fechaFin"
                >
            </div>

        </div>

        <button
            class="boton-generar"
            id="generar"
            type="button"
        >
            Generar fecha
        </button>

        <div class="resultado">

            <div class="resultado-titulo">
                Fecha generada
            </div>

            <div class="fecha" id="resultado">
                —
            </div>

            <div class="mensaje" id="mensaje"></div>

        </div>

    </section>

    <a href="generadores.html" class="volver">
        ← Volver a Generadores
    </a>

</main>

<script>

    const fechaInicio = document.getElementById("fechaInicio");
    const fechaFin = document.getElementById("fechaFin");
    const generar = document.getElementById("generar");
    const resultado = document.getElementById("resultado");
    const mensaje = document.getElementById("mensaje");

    function formatearFecha(fecha) {

        const dia = String(fecha.getDate()).padStart(2, "0");
        const mes = String(fecha.getMonth() + 1).padStart(2, "0");
        const año = fecha.getFullYear();

        return `${dia}/${mes}/${año}`;
    }

    generar.addEventListener("click", () => {

        mensaje.textContent = "";

        if (!fechaInicio.value || !fechaFin.value) {
            mensaje.textContent =
                "Selecciona una fecha inicial y una fecha final.";
            resultado.textContent = "—";
            return;
        }

        const inicio = new Date(
            fechaInicio.value + "T00:00:00"
        );

        const fin = new Date(
            fechaFin.value + "T00:00:00"
        );

        if (inicio > fin) {
            mensaje.textContent =
                "La fecha inicial no puede ser posterior a la fecha final.";
            resultado.textContent = "—";
            return;
        }

        const diferencia =
            fin.getTime() - inicio.getTime();

        const dias =
            Math.floor(
                diferencia / (1000 * 60 * 60 * 24)
            );

        const diaAleatorio =
            Math.floor(
                Math.random() * (dias + 1)
            );

        const fechaAleatoria =
            new Date(inicio);

        fechaAleatoria.setDate(
            inicio.getDate() + diaAleatorio
        );

        resultado.textContent =
            formatearFecha(fechaAleatoria);
    });

</script>

</body>
</html>
