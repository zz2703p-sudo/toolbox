<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayúsculas y minúsculas | Herramio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .herramienta {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        textarea {
            width: 100%;
            min-height: 260px;
            resize: vertical;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #1f2937;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 13px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .boton-secundario {
            background: #e5e7eb;
            color: #374151;
        }

        .boton-secundario:hover {
            background: #d1d5db;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .herramienta {
                padding: 20px;
            }

            .botones {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Herramio</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>🔠 Mayúsculas y minúsculas</h1>
        <p>Convierte tu texto rápidamente entre diferentes formatos.</p>
    </div>

    <section class="herramienta">

        <textarea
            id="texto"
            placeholder="Escribe o pega tu texto aquí..."
        ></textarea>

        <div class="botones">

            <button id="mayusculas" type="button">
                MAYÚSCULAS
            </button>

            <button id="minusculas" type="button">
                minúsculas
            </button>

            <button id="primera" type="button">
                Primera letra mayúscula
            </button>

            <button id="titulo" type="button">
                Formato título
            </button>

            <button
                id="invertir"
                type="button"
            >
                Invertir mayúsculas/minúsculas
            </button>

            <button
                id="limpiar"
                type="button"
                class="boton-secundario"
            >
                Limpiar
            </button>

        </div>

    </section>

    <a href="herramientas.html" class="volver">
        ← Volver a Herramientas
    </a>

</main>

<script>

    const texto = document.getElementById("texto");

    const mayusculas =
        document.getElementById("mayusculas");

    const minusculas =
        document.getElementById("minusculas");

    const primera =
        document.getElementById("primera");

    const titulo =
        document.getElementById("titulo");

    const invertir =
        document.getElementById("invertir");

    const limpiar =
        document.getElementById("limpiar");


    mayusculas.addEventListener("click", () => {

        texto.value =
            texto.value.toUpperCase();

    });


    minusculas.addEventListener("click", () => {

        texto.value =
            texto.value.toLowerCase();

    });


    primera.addEventListener("click", () => {

        const contenido = texto.value;

        texto.value =
            contenido.charAt(0).toUpperCase() +
            contenido.slice(1).toLowerCase();

    });


    titulo.addEventListener("click", () => {

        texto.value =
            texto.value
                .toLowerCase()
                .replace(
                    /\b\w/g,
                    letra => letra.toUpperCase()
                );

    });


    invertir.addEventListener("click", () => {

        texto.value =
            [...texto.value]
                .map(letra => {

                    if (letra === letra.toUpperCase()) {
                        return letra.toLowerCase();
                    }

                    return letra.toUpperCase();

                })
                .join("");

    });


    limpiar.addEventListener("click", () => {

        texto.value = "";

        texto.focus();

    });

</script>

</body>
</html>
