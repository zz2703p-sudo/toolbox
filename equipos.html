<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de equipos | Herramio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .generador {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .campos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .campo textarea,
        .campo input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            outline: none;
        }

        .campo textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.5;
        }

        .campo textarea:focus,
        .campo input:focus {
            border-color: #2563eb;
        }

        .ayuda {
            margin-top: 8px;
            color: #6b7280;
            font-size: 13px;
        }

        .boton-generar {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-generar:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 25px;
            padding: 25px 20px;
            background: #f1f5f9;
            border-radius: 10px;
        }

        .resultado-titulo {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .equipos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .equipo {
            background: white;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #e5e7eb;
        }

        .equipo h3 {
            color: #1e3a8a;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .jugador {
            padding: 7px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 15px;
        }

        .jugador:last-child {
            border-bottom: none;
        }

        .error {
            margin-top: 15px;
            color: #dc2626;
            text-align: center;
            font-size: 14px;
            min-height: 18px;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .generador {
                padding: 20px;
            }

            .campos {
                grid-template-columns: 1fr;
            }

            .equipos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Herramio</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>👥 Generador de equipos</h1>
        <p>Reparte jugadores aleatoriamente en equipos equilibrados.</p>
    </div>

    <section class="generador">

        <div class="campos">

            <div class="campo">

                <label for="jugadores">
                    Jugadores
                </label>

                <textarea
                    id="jugadores"
                    placeholder="Escribe un jugador por línea..."
                ></textarea>

                <div class="ayuda">
                    Introduce todos los nombres, uno por línea.
                </div>

            </div>

            <div class="campo">

                <label for="cantidadEquipos">
                    Número de equipos
                </label>

                <input
                    type="number"
                    id="cantidadEquipos"
                    min="2"
                    value="2"
                >

                <div class="ayuda">
                    Mínimo 2 equipos.
                </div>

            </div>

        </div>

        <button
            class="boton-generar"
            id="generar"
            type="button"
        >
            Generar equipos
        </button>

        <div class="resultado">

            <div class="resultado-titulo">
                Equipos generados
            </div>

            <div class="equipos" id="equipos">
                <!-- Los equipos aparecerán aquí -->
            </div>

        </div>

        <div class="error" id="error"></div>

    </section>

    <a href="generadores.html" class="volver">
        ← Volver a Generadores
    </a>

</main>

<script>

    const jugadores = document.getElementById("jugadores");
    const cantidadEquipos = document.getElementById("cantidadEquipos");
    const generar = document.getElementById("generar");
    const equipos = document.getElementById("equipos");
    const error = document.getElementById("error");

    generar.addEventListener("click", () => {

        const listaJugadores = jugadores.value
            .split("\n")
            .map(jugador => jugador.trim())
            .filter(jugador => jugador !== "");

        const numeroEquipos = Number(cantidadEquipos.value);

        equipos.innerHTML = "";
        error.textContent = "";

        if (listaJugadores.length < 2) {
            error.textContent = "Introduce al menos 2 jugadores.";
            return;
        }

        if (
            !Number.isInteger(numeroEquipos) ||
            numeroEquipos < 2
        ) {
            error.textContent = "Introduce al menos 2 equipos.";
            return;
        }

        if (numeroEquipos > listaJugadores.length) {
            error.textContent =
                "No puede haber más equipos que jugadores.";
            return;
        }

        // Copia de los jugadores
        const jugadoresMezclados = [...listaJugadores];

        // Mezclar jugadores aleatoriamente
        for (
            let i = jugadoresMezclados.length - 1;
            i > 0;
            i--
        ) {
            const j = Math.floor(Math.random() * (i + 1));

            [
                jugadoresMezclados[i],
                jugadoresMezclados[j]
            ] = [
                jugadoresMezclados[j],
                jugadoresMezclados[i]
            ];
        }

        // Crear equipos
        const listaEquipos = [];

        for (let i = 0; i < numeroEquipos; i++) {
            listaEquipos.push([]);
        }

        // Repartir jugadores
        jugadoresMezclados.forEach((jugador, indice) => {
            listaEquipos[indice % numeroEquipos].push(jugador);
        });

        // Mostrar equipos
        listaEquipos.forEach((equipo, indice) => {

            const tarjeta = document.createElement("div");

            tarjeta.className = "equipo";

            const titulo = document.createElement("h3");

            titulo.textContent = `Equipo ${indice + 1}`;

            tarjeta.appendChild(titulo);

            equipo.forEach(jugador => {

                const elemento = document.createElement("div");

                elemento.className = "jugador";
                elemento.textContent = jugador;

                tarjeta.appendChild(elemento);
            });

            equipos.appendChild(tarjeta);
        });

    });

</script>

</body>
</html>
