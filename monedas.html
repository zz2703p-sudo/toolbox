<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monedas | Herramio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .pagina {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecera h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .cabecera p {
            color: #6b7280;
            font-size: 17px;
        }

        .conversor {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: end;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #2563eb;
        }

        .intercambiar {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #eef2ff;
            color: #2563eb;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .intercambiar:hover {
            background: #dbeafe;
        }

        .boton-convertir {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-convertir:hover {
            background: #1d4ed8;
        }

        .resultado {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
            min-height: 65px;
        }

        .resultado-titulo {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .resultado-valor {
            font-size: 26px;
            font-weight: bold;
            color: #1e3a8a;
            word-break: break-word;
        }

        .estado {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #6b7280;
            min-height: 18px;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .pagina {
                padding-top: 40px;
            }

            .cabecera h1 {
                font-size: 32px;
            }

            .conversor {
                padding: 20px;
            }

            .fila {
                grid-template-columns: 1fr;
            }

            .intercambiar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Herramio</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="calculadoras.html">Calculadoras</a>
        <a href="conversores.html">Conversores</a>
        <a href="generadores.html">Generadores</a>
        <a href="herramientas.html">Herramientas</a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecera">
        <h1>💰 Conversor de monedas</h1>
        <p>Convierte monedas utilizando tipos de cambio actuales.</p>
    </div>

    <section class="conversor">

        <div class="fila">

            <div class="campo">
                <label for="valor">Cantidad</label>

                <input
                    type="number"
                    id="valor"
                    step="any"
                    min="0"
                    placeholder="Introduce una cantidad"
                >
            </div>

            <button
                class="intercambiar"
                id="intercambiar"
                type="button"
                title="Intercambiar monedas"
            >
                ⇄
            </button>

            <div class="campo">

                <label for="monedaOrigen">De</label>

                <select id="monedaOrigen">
                    <option value="EUR" selected>Euro (EUR)</option>
                    <option value="USD">Dólar estadounidense (USD)</option>
                    <option value="GBP">Libra esterlina (GBP)</option>
                    <option value="JPY">Yen japonés (JPY)</option>
                    <option value="CHF">Franco suizo (CHF)</option>
                    <option value="CAD">Dólar canadiense (CAD)</option>
                    <option value="AUD">Dólar australiano (AUD)</option>
                    <option value="NZD">Dólar neozelandés (NZD)</option>
                    <option value="CNY">Yuan chino (CNY)</option>
                    <option value="HKD">Dólar de Hong Kong (HKD)</option>
                    <option value="SGD">Dólar de Singapur (SGD)</option>
                    <option value="SEK">Corona sueca (SEK)</option>
                    <option value="NOK">Corona noruega (NOK)</option>
                    <option value="DKK">Corona danesa (DKK)</option>
                    <option value="PLN">Zloty polaco (PLN)</option>
                    <option value="CZK">Corona checa (CZK)</option>
                    <option value="HUF">Forinto húngaro (HUF)</option>
                    <option value="RON">Leu rumano (RON)</option>
                    <option value="BGN">Lev búlgaro (BGN)</option>
                    <option value="TRY">Lira turca (TRY)</option>
                    <option value="BRL">Real brasileño (BRL)</option>
                    <option value="MXN">Peso mexicano (MXN)</option>
                    <option value="INR">Rupia india (INR)</option>
                    <option value="ZAR">Rand sudafricano (ZAR)</option>
                </select>

                <label for="monedaDestino" style="margin-top: 15px;">
                    A
                </label>

                <select id="monedaDestino">
                    <option value="EUR">Euro (EUR)</option>
                    <option value="USD" selected>Dólar estadounidense (USD)</option>
                    <option value="GBP">Libra esterlina (GBP)</option>
                    <option value="JPY">Yen japonés (JPY)</option>
                    <option value="CHF">Franco suizo (CHF)</option>
                    <option value="CAD">Dólar canadiense (CAD)</option>
                    <option value="AUD">Dólar australiano (AUD)</option>
                    <option value="NZD">Dólar neozelandés (NZD)</option>
                    <option value="CNY">Yuan chino (CNY)</option>
                    <option value="HKD">Dólar de Hong Kong (HKD)</option>
                    <option value="SGD">Dólar de Singapur (SGD)</option>
                    <option value="SEK">Corona sueca (SEK)</option>
                    <option value="NOK">Corona noruega (NOK)</option>
                    <option value="DKK">Corona danesa (DKK)</option>
                    <option value="PLN">Zloty polaco (PLN)</option>
                    <option value="CZK">Corona checa (CZK)</option>
                    <option value="HUF">Forinto húngaro (HUF)</option>
                    <option value="RON">Leu rumano (RON)</option>
                    <option value="BGN">Lev búlgaro (BGN)</option>
                    <option value="TRY">Lira turca (TRY)</option>
                    <option value="BRL">Real brasileño (BRL)</option>
                    <option value="MXN">Peso mexicano (MXN)</option>
                    <option value="INR">Rupia india (INR)</option>
                    <option value="ZAR">Rand sudafricano (ZAR)</option>
                </select>

            </div>

        </div>

        <button class="boton-convertir" id="convertir" type="button">
            Convertir
        </button>

        <div class="resultado">

            <div class="resultado-titulo">
                Resultado
            </div>

            <div class="resultado-valor" id="resultado">
                —
            </div>

        </div>

        <div class="estado" id="estado"></div>

    </section>

    <a href="conversores.html" class="volver">
        ← Volver a Conversores
    </a>

</main>

<script>

    const valor = document.getElementById("valor");
    const monedaOrigen = document.getElementById("monedaOrigen");
    const monedaDestino = document.getElementById("monedaDestino");
    const convertir = document.getElementById("convertir");
    const intercambiar = document.getElementById("intercambiar");
    const resultado = document.getElementById("resultado");
    const estado = document.getElementById("estado");

    function limpiarResultado() {
        resultado.textContent = "—";
        estado.textContent = "";
    }

    function formato(numero) {
        return new Intl.NumberFormat("es-ES", {
            maximumFractionDigits: 6
        }).format(numero);
    }

    convertir.addEventListener("click", async () => {

        if (valor.value.trim() === "") {
            resultado.textContent = "Introduce una cantidad.";
            estado.textContent = "";
            return;
        }

        const cantidad = Number(valor.value);

        if (!Number.isFinite(cantidad) || cantidad < 0) {
            resultado.textContent = "Introduce una cantidad válida.";
            estado.textContent = "";
            return;
        }

        const origen = monedaOrigen.value;
        const destino = monedaDestino.value;

        if (origen === destino) {
            resultado.textContent =
                `${formato(cantidad)} ${destino}`;

            estado.textContent = "Misma moneda seleccionada.";
            return;
        }

        resultado.textContent = "Calculando...";
        estado.textContent = "Obteniendo el tipo de cambio...";

        try {

            const respuesta = await fetch(
                `https://api.frankfurter.app/latest?amount=${cantidad}&from=${origen}&to=${destino}`
            );

            if (!respuesta.ok) {
                throw new Error("Error en la API");
            }

            const datos = await respuesta.json();

            if (!datos.rates || datos.rates[destino] === undefined) {
                throw new Error("No se encontró el tipo de cambio.");
            }

            const convertido = datos.rates[destino];

            resultado.textContent =
                `${formato(convertido)} ${destino}`;

            estado.textContent =
                "Tipo de cambio actualizado desde Frankfurter.";

        } catch (error) {

            resultado.textContent =
                "No se pudo obtener el tipo de cambio.";

            estado.textContent =
                "Comprueba tu conexión a Internet e inténtalo de nuevo.";
        }
    });

    intercambiar.addEventListener("click", () => {

        const temporal = monedaOrigen.value;

        monedaOrigen.value = monedaDestino.value;
        monedaDestino.value = temporal;

        limpiarResultado();
    });

    valor.addEventListener("input", limpiarResultado);
    monedaOrigen.addEventListener("change", limpiarResultado);
    monedaDestino.addEventListener("change", limpiarResultado);

</script>

</body>
</html>
